<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="icon" type="image/jpg" href="./images/calculator.jpg">
        <link href="./styles.css" rel="stylesheet" type="text/css" />
        <script src="./script.js" defer></script>
    </head>

    <main>
        <div id="container">
            <div id="main-box">
                <h2>Calculator</h2>
                <div id="display">
                    <p>0</p>
                </div>
                <div id="buttons">
                    <button id="btn-1" type="button">1</button>
                    <button id="btn-2" type="button">2</button>
                    <button id="btn-3" type="button">3</button>
                    <button id="btn-4" type="button">4</button>
                    <button id="btn-5" type="button">5</button>
                    <button id="btn-6" type="button">6</button>
                    <button id="btn-7" type="button">7</button>
                    <button id="btn-8" type="button">8</button>
                    <button id="btn-9" type="button">9</button>
                    <button id="btn-0" type="button">0</button>
                    <button id="btn-dot" type="button">.</button>
                    <button id="btn-addition" type="button">+</button>
                    <button id="btn-subtraction" type="button">-</button>
                    <button id="btn-multiply" type="button">x</button>
                    <button id="btn-division" type="button">/</button>
                    <button id="btn-reset" type="button">AC</button>
                </div>
            </div>
        </div>
    </main>
</html>
